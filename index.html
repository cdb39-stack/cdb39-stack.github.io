<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <title>Christopher Bennett</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      color: #252a32;
      background: #f4f1ea;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 8vw, 5rem);
      border: 1px solid #d9d4c9;
      background: #fbfaf7;
      box-shadow: 12px 12px 0 #e6e1d6;
    }

    p {
      margin: 0 0 1rem;
      color: #667166;
      font: 700 0.75rem/1.4 system-ui, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 1.25rem;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .about {
      margin: 0;
      color: #535963;
      font: 400 clamp(1.05rem, 2.5vw, 1.25rem)/1.7 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <p>A little about me</p>
    <h1>Christopher Bennett</h1>
    <p class="about">I am a Freshman at NJIT studying Software and Data Engineering Technology who enjoys reading, writing, and cats.</p>
  </main>
</body>
</html>
